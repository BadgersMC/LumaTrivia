# LumaTrivia Configuration

# API Settings
api:
  url: "https://opentdb.com/api.php"
  batch-size: 24
  timeout-ms: 10000

# Game Settings
game:
  answer-time: 30
  cooldown: 300
  channel: \"global\"
  mute-incorrect:
    enabled: true
  schedule:
    enabled: false
    times:
      - "12:00"
      - "18:00"
      - "21:00"
  categories:
    - 9
    - 15
    - 17
  difficulties:
    - easy
    - medium
    - hard

# Reward Settings
rewards:
  easy:
    commands:
      - "eco give %player% 100"
    points: 1
  medium:
    commands:
      - "eco give %player% 250"
    points: 2
  hard:
    commands:
      - "eco give %player% 500"
    points: 3

# Content Filter Settings
content-filter:
  enabled: true
  log-filtered: true
  blocked-patterns:
    - "(?i)suicide|death|kill"
    - "(?i)sex|nsfw|adult"
    - "(?i)drugs?|alcohol|cocaine|heroin"
    - "(?i)violence|murder|gore"
    - "(?i)blood|bloody"
    - "(?i)curse|damn|hell"
  required-pattern: ""

# Storage Settings
storage:
  backend: sqlite
  file: stats.db
