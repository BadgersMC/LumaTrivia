# Reward Settings
rewards:
  easy:
    commands:
      - "give %player% raw_gold 5"
    points: 1
  medium:
    commands:
      - "give %player% raw_gold 10"
    points: 2
  hard:
    commands:
      - "give %player% raw_gold 15"
    points: 3

# Content Filter Settings
content-filter:
  enabled: true
  log-filtered: true
  blocked-patterns:
    - "(?i)suicide|death|kill"
    - "(?i)sex|nsfw|adult"
    - "(?i)drugs?|alcohol|cocaine|heroin"
    - "(?i)violence|murder|gore"
    - "(?i)blood|bloody"
    - "(?i)curse|damn|hell"
  required-pattern: ""

# Storage Settings
storage:
  backend: sqlite
  file: stats.db
