name: LumaTrivia
version: '${version}'
main: net.badgersmc.trivia.infrastructure.bukkit.LumaTriviaPlugin
loader: net.badgersmc.trivia.loader.LumaTriviaLoader
api-version: '1.21'
authors: [BadgersMC]
description: A trivia game plugin using OpenTriviaDB
website: https://github.com/BadgersMC

dependencies:
  server:
    RoseChat:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  lumatrivia.use:
    description: Allows viewing stats and leaderboards
    default: true
  lumatrivia.start:
    description: Allows starting trivia games
    default: op
  lumatrivia.admin:
    description: Allows use of administrative trivia commands (reload)
    default: op
    children:
      lumatrivia.start: true
      lumatrivia.use: true
  lumatrivia.mute.bypass:
    description: Exempt from wrong-answer muting
    default: op
